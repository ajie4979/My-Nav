# =================================================================
#  项目配置（共享版，可提交到公开仓库）
#
#  - main/assets/站点变量：所有部署者共用，无需改动
#  - D1 / KV 绑定：通过 Cloudflare 网页「设置 → 绑定」添加，
#    避免在公开仓库暴露个人资源 ID（每人绑定自己账户的资源）
# =================================================================

name = "my-nav"
compatibility_date = "2026-08-26"
main = ".wrangler/worker-build/index.js"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[vars]
ENABLE_PUBLIC_SUBMISSION = false
SITE_NAME = "简读记忆"
SITE_DESCRIPTION = "一个优雅、快速、易于部署的书签收藏与博客平台"
FOOTER_TEXT = "曾梦想仗剑走天涯"
ICON_API = "https://faviconsnap.com/api/favicon?url="
AI_REQUEST_DELAY = "1500"

# -----------------------------------------------------------------
#  D1 / KV 绑定（变量名固定，个人资源 ID 通过环境变量注入，
#  不在公开仓库暴露；部署前在 Cloudflare 项目 → 设置 → 变量
#  和机密 里配置两个构建时变量：
#    D1_DATABASE_ID = 你的 D1 database_id
#    KV_NAMESPACE_ID = 你的 KV namespace id
#  本地开发时在系统环境变量里设置，或复制 wrangler.example.toml
#  直接填写 ID）
#   - NAV_DB：D1 数据库（book）
#   - NAV_AUTH：KV 命名空间（NAV_AUTH）
# -----------------------------------------------------------------

[[d1_databases]]
binding = "NAV_DB"
database_name = "book"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "NAV_AUTH"
id = "${KV_NAMESPACE_ID}"
