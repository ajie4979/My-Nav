<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博客 - 文章列表</title>
  <meta name="description" content="博客文章列表">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="/css/tailwind.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background-color: #f5f6f8; }
    .dark body { background-color: #111827; }

    /* 排序栏 */
    .sort-bar {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 12px 0;
      font-size: 14px;
      color: #6b7280;
    }
    .dark .sort-bar { color: #9ca3af; }
    .sort-bar .sort-label { font-weight: 500; color: #374151; margin-right: 8px; }
    .dark .sort-bar .sort-label { color: #e5e7eb; }
    .sort-bar .sort-item {
      padding: 4px 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sort-bar .sort-item:hover { background-color: rgba(0,0,0,0.05); }
    .dark .sort-bar .sort-item:hover { background-color: rgba(255,255,255,0.1); }
    .sort-bar .sort-item.active { color: #3b82f6; font-weight: 500; }
    .sort-bar .sort-divider { color: #d1d5db; margin: 0 4px; }
    .dark .sort-bar .sort-divider { color: #4b5563; }

    /* 文章卡片 - 两列布局 */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 768px) {
      .posts-grid { grid-template-columns: 1fr; }
    }

    .post-card {
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid #eef0f3;
      min-height: 160px;
    }
    .dark .post-card {
      background: #1f2937;
      border-color: #374151;
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .post-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .post-title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .dark .post-title { color: #f3f4f6; }
    .post-summary {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .dark .post-summary { color: #9ca3af; }
    .post-category {
      display: inline-block;
      padding: 2px 8px;
      background: #eff6ff;
      color: #3b82f6;
      font-size: 12px;
      border-radius: 4px;
      margin-bottom: 10px;
      width: fit-content;
    }
    .dark .post-category {
      background: rgba(59,130,246,0.15);
      color: #60a5fa;
    }
    .post-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #9ca3af;
      margin-top: auto;
    }
    .post-author {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .author-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: 600;
    }
    .post-stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .stat-item svg { width: 14px; height: 14px; }

    /* 无封面时的占位 */
    .post-cover-placeholder {
      width: 180px;
      min-width: 180px;
      height: 140px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body class="font-sans text-gray-800 dark:text-gray-100 min-h-screen">
  <!-- 顶部导航 -->
  <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-100 dark:border-gray-700 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <a href="/" class="flex items-center text-gray-600 dark:text-gray-300 hover:text-primary-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          返回导航
        </a>
        <h1 class="text-xl font-bold text-gray-800 dark:text-gray-100">博客</h1>
      </div>
      <div class="flex items-center space-x-2">
        <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="切换主题">
          <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-12">
    <!-- 搜索栏 -->
    <div class="relative mb-4">
      <input type="text" id="searchInput" placeholder="搜索文章标题或内容..."
        class="w-full px-4 py-3 pl-12 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent transition-all shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>

    <!-- 排序栏 -->
    <div class="sort-bar">
      <span class="sort-label">排序</span>
      <span class="sort-item active" data-sort="newest">更新</span>
      <span class="sort-divider">·</span>
      <span class="sort-item" data-sort="views">浏览</span>
      <span class="sort-divider">·</span>
      <span class="sort-item" data-sort="likes">点赞</span>
    </div>

    <!-- 文章列表 - 两列布局 -->
    <div id="postsGrid" class="posts-grid">
      <!-- 加载状态 -->
      <div id="loadingState" class="col-span-2 text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary-200 border-t-primary-500"></div>
        <p class="mt-4 text-gray-500 dark:text-gray-400">加载中...</p>
      </div>
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="hidden text-center py-16">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-300 dark:text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <p class="mt-4 text-gray-500 dark:text-gray-400">暂无文章</p>
    </div>

    <!-- 分页 -->
    <div id="pagination" class="hidden flex items-center justify-center space-x-2 mt-8">
      <button id="prevPage" class="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        上一页
      </button>
      <span id="pageInfo" class="px-4 py-2 text-gray-600 dark:text-gray-300"></span>
      <button id="nextPage" class="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        下一页
      </button>
    </div>
  </main>

  <footer class="border-t border-gray-200 dark:border-gray-700 py-6 mt-8">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-500 dark:text-gray-400">
      <p>© <span id="currentYear"></span> 博客</p>
    </div>
  </footer>

  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    });

    // 状态
    let currentPage = 1;
    const pageSize = 10;
    let totalPages = 1;
    let searchKeyword = '';
    let searchTimer = null;
    let currentSort = 'newest';

    const postsGrid = document.getElementById('postsGrid');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const pagination = document.getElementById('pagination');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevPage');
    const nextBtn = document.getElementById('nextPage');

    // 相对时间格式化
    function formatRelativeTime(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diff = now - date;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      if (days === 0) return '今天';
      if (days === 1) return '昨天';
      if (days < 30) return `${days}天前`;
      if (days < 365) return `${Math.floor(days / 30)}个月前`;
      return `${Math.floor(days / 365)}年前`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getInitials(name) {
      if (!name) return '管';
      return name.charAt(0);
    }

    function renderPosts(posts) {
      if (!posts || posts.length === 0) {
        postsGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        pagination.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      postsGrid.innerHTML = posts.map(post => {
        return `
          <article class="post-card" data-id="${post.id}">
            <div class="post-content">
              <h2 class="post-title">${escapeHtml(post.title)}</h2>
              <p class="post-summary">${escapeHtml(post.summary || post.content.substring(0, 100) + '...')}</p>
              <span class="post-category">${escapeHtml(post.category || '未分类')}</span>
              <div class="post-meta">
                <div class="post-author">
                  <div class="author-avatar">${getInitials(post.author)}</div>
                  <span>${escapeHtml(post.author || '管理员')}</span>
                  <span style="color:#d1d5db;">·</span>
                  <span>${formatRelativeTime(post.create_time)}</span>
                </div>
                <div class="post-stats">
                  <span class="stat-item" title="浏览">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    ${post.view_count || 0}
                  </span>
                  <span class="stat-item" title="点赞">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5" />
                    </svg>
                    ${post.like_count || 0}
                  </span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      // 绑定点击事件
      postsGrid.querySelectorAll('.post-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          window.location.href = `/blog/post.html?id=${id}`;
        });
      });
    }

    async function loadPosts() {
      postsGrid.innerHTML = '<div id="loadingState" class="col-span-2 text-center py-12"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary-200 border-t-primary-500"></div><p class="mt-4 text-gray-500 dark:text-gray-400">加载中...</p></div>';
      emptyState.classList.add('hidden');
      pagination.classList.add('hidden');

      try {
        const params = new URLSearchParams({
          page: currentPage,
          pageSize: pageSize,
          scope: 'public',
          sort: currentSort
        });
        if (searchKeyword) {
          params.set('keyword', searchKeyword);
        }

        const res = await fetch(`/api/posts?${params.toString()}`);
        const data = await res.json();

        if (data.code === 200) {
          renderPosts(data.data);
          totalPages = Math.ceil(data.total / pageSize);

          if (totalPages > 1) {
            pagination.classList.remove('hidden');
            pagination.classList.add('flex');
            pageInfo.textContent = `${currentPage} / ${totalPages}`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
          }
        } else {
          postsGrid.innerHTML = '';
          emptyState.classList.remove('hidden');
        }
      } catch (e) {
        postsGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.querySelector('p').textContent = '加载失败，请稍后重试';
        console.error('Load posts failed:', e);
      }
    }

    // 搜索
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchKeyword = e.target.value.trim();
        currentPage = 1;
        loadPosts();
      }, 300);
    });

    // 排序切换
    document.querySelectorAll('.sort-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.sort-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        currentSort = item.dataset.sort;
        currentPage = 1;
        loadPosts();
      });
    });

    // 分页
    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadPosts();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        loadPosts();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    // 初始加载
    loadPosts();
  </script>
</body>
</html>
