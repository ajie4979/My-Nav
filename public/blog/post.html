<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章详情 - 博客</title>
  <meta name="description" content="博客文章详情">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="/css/tailwind.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .prose-content h1 { font-size: 1.875rem; font-weight: 700; margin: 1.5rem 0 1rem; }
    .prose-content h2 { font-size: 1.5rem; font-weight: 600; margin: 1.25rem 0 0.75rem; }
    .prose-content h3 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    .prose-content p { margin: 0.75rem 0; line-height: 1.8; }
    .prose-content ul, .prose-content ol { margin: 0.75rem 0; padding-left: 1.5rem; }
    .prose-content li { margin: 0.25rem 0; line-height: 1.7; }
    .prose-content code { background: rgba(0,0,0,0.06); padding: 0.125rem 0.375rem; border-radius: 4px; font-size: 0.875em; }
    .prose-content pre { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 1rem 0; }
    .prose-content pre code { background: none; padding: 0; color: inherit; }
    .prose-content blockquote { border-left: 4px solid #6366f1; padding-left: 1rem; margin: 1rem 0; color: #6b7280; font-style: italic; }
    .prose-content a { color: #6366f1; text-decoration: underline; }
    .prose-content img { max-width: 100%; border-radius: 8px; margin: 1rem 0; }
    .prose-content table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    .prose-content th, .prose-content td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
    .prose-content th { background: #f9fafb; font-weight: 600; }
    .dark .prose-content code { background: rgba(255,255,255,0.1); }
    .dark .prose-content blockquote { color: #9ca3af; }
    .dark .prose-content th { background: #374151; }
    .dark .prose-content th, .dark .prose-content td { border-color: #4b5563; }
    .dark .prose-content hr { border-color: #4b5563; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-secondary-50 font-sans text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen">
  <!-- 顶部导航 -->
  <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-100 dark:border-gray-700 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <a href="/blog" class="flex items-center text-gray-600 dark:text-gray-300 hover:text-primary-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          博客列表
        </a>
      </div>
      <div class="flex items-center space-x-2">
        <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="切换主题">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 文章内容 -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8">
    <div id="loadingState" class="text-center py-16">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary-200 border-t-primary-500"></div>
      <p class="mt-4 text-gray-500 dark:text-gray-400">加载中...</p>
    </div>

    <div id="errorState" class="hidden text-center py-16">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-300 dark:text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <p id="errorMessage" class="mt-4 text-gray-500 dark:text-gray-400">文章不存在或已被删除</p>
      <a href="/blog" class="inline-block mt-4 px-4 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 transition-colors">返回博客列表</a>
    </div>

    <article id="articleContent" class="hidden">
      <!-- 文章头部 -->
      <header class="mb-8">
        <h1 id="postTitle" class="text-3xl sm:text-4xl font-bold text-gray-800 dark:text-gray-100 mb-4 leading-tight"></h1>
        <div class="flex flex-wrap items-center gap-4 text-sm text-gray-500 dark:text-gray-400">
          <span class="flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span id="postDate"></span>
          </span>
          <span class="flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <span id="postViews"></span> 次阅读
          </span>
          <span id="postStatusBadge" class="hidden px-2 py-0.5 rounded text-xs"></span>
        </div>
      </header>

      <!-- 封面图 -->
      <div id="postCover" class="mb-8 hidden">
        <img id="postCoverImg" src="" alt="" class="w-full rounded-xl shadow-md">
      </div>

      <!-- 文章正文 -->
      <div id="postBody" class="prose-content text-gray-700 dark:text-gray-300"></div>

      <!-- 点赞区域 -->
      <div class="mt-12 flex justify-center">
        <button id="likeBtn" class="flex items-center gap-2 px-6 py-3 bg-gray-100 dark:bg-gray-800 hover:bg-red-50 dark:hover:bg-red-900/20 text-gray-600 dark:text-gray-300 hover:text-red-500 rounded-full transition-all duration-300 group">
          <svg id="likeIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5" />
          </svg>
          <span id="likeCount" class="text-sm font-medium">0</span>
        </button>
      </div>

      <!-- 文章底部 -->
      <footer class="mt-12 pt-8 border-t border-gray-200 dark:border-gray-700">
        <a href="/blog" class="inline-flex items-center text-primary-500 hover:text-primary-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          返回博客列表
        </a>
      </footer>
    </article>
  </main>

  <footer class="border-t border-gray-200 dark:border-gray-700 py-6 mt-8">
    <div class="max-w-4xl mx-auto px-4 text-center text-sm text-gray-500 dark:text-gray-400">
      <p>© <span id="currentYear"></span> 博客</p>
    </div>
  </footer>

  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // 主题切换
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    });

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
    }

    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        showError('缺少文章 ID');
        return;
      }

      try {
        const res = await fetch(`/api/posts/${encodeURIComponent(id)}`);
        const data = await res.json();

        document.getElementById('loadingState').classList.add('hidden');

        if (data.code !== 200 || !data.data) {
          showError(data.message || '文章不存在或已被删除');
          return;
        }

        const post = data.data;
        document.title = `${post.title} - 博客`;

        document.getElementById('postTitle').textContent = post.title;
        document.getElementById('postDate').textContent = formatDate(post.create_time);
        document.getElementById('postViews').textContent = post.view_count || 0;
        document.getElementById('likeCount').textContent = post.like_count || 0;

        // 检查是否已点赞
        const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '[]');
        if (likedPosts.includes(post.id)) {
          setLikedState(true);
        }

        // 状态标签
        const statusBadge = document.getElementById('postStatusBadge');
        if (post.status === 'draft') {
          statusBadge.textContent = '草稿';
          statusBadge.className = 'px-2 py-0.5 bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400 rounded text-xs';
          statusBadge.classList.remove('hidden');
        } else if (post.is_private === 1) {
          statusBadge.textContent = '私密';
          statusBadge.className = 'px-2 py-0.5 bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300 rounded text-xs';
          statusBadge.classList.remove('hidden');
        }

        // 封面图
        if (post.cover_image) {
          document.getElementById('postCover').classList.remove('hidden');
          document.getElementById('postCoverImg').src = post.cover_image;
          document.getElementById('postCoverImg').alt = post.title;
        }

        // 渲染 Markdown
        const body = document.getElementById('postBody');
        if (window.marked) {
          body.innerHTML = marked.parse(post.content);
        } else {
          body.textContent = post.content;
        }

        document.getElementById('articleContent').classList.remove('hidden');
      } catch (e) {
        document.getElementById('loadingState').classList.add('hidden');
        showError('加载失败，请稍后重试');
        console.error('Load post failed:', e);
      }
    }

    function showError(message) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMessage').textContent = message;
    }

    // 点赞功能
    let currentPostId = null;
    let isLiking = false;

    function setLikedState(liked) {
      const btn = document.getElementById('likeBtn');
      const icon = document.getElementById('likeIcon');
      if (liked) {
        btn.classList.add('bg-red-50', 'dark:bg-red-900/20', 'text-red-500');
        btn.classList.remove('bg-gray-100', 'dark:bg-gray-800', 'text-gray-600', 'dark:text-gray-300');
        icon.setAttribute('fill', 'currentColor');
      } else {
        btn.classList.remove('bg-red-50', 'dark:bg-red-900/20', 'text-red-500');
        btn.classList.add('bg-gray-100', 'dark:bg-gray-800', 'text-gray-600', 'dark:text-gray-300');
        icon.setAttribute('fill', 'none');
      }
    }

    document.getElementById('likeBtn').addEventListener('click', async () => {
      if (isLiking || !currentPostId) return;
      isLiking = true;

      const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '[]');
      const alreadyLiked = likedPosts.includes(currentPostId);

      try {
        const res = await fetch(`/api/posts/${currentPostId}/like`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: alreadyLiked ? 'unlike' : 'like' })
        });
        const data = await res.json();

        if (data.code === 200) {
          const countEl = document.getElementById('likeCount');
          const currentCount = parseInt(countEl.textContent) || 0;

          if (alreadyLiked) {
            // 取消点赞
            const idx = likedPosts.indexOf(currentPostId);
            if (idx > -1) likedPosts.splice(idx, 1);
            countEl.textContent = Math.max(0, currentCount - 1);
            setLikedState(false);
          } else {
            // 点赞
            likedPosts.push(currentPostId);
            countEl.textContent = currentCount + 1;
            setLikedState(true);
          }
          localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
        }
      } catch (e) {
        console.error('Like failed:', e);
      } finally {
        isLiking = false;
      }
    });

    // 获取当前文章ID
    const urlParams = new URLSearchParams(window.location.search);
    currentPostId = urlParams.get('id');

    loadPost();
  </script>
</body>
</html>
