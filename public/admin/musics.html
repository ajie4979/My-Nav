<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐管理 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/admin-layout.css" />
  <link rel="stylesheet" href="/css/admin-forms.css" />
  <link rel="stylesheet" href="/css/admin-feedback.css" />
  <link rel="stylesheet" href="/css/tailwind.min.css">
  <style>
    .music-row:hover { background-color: #f9fafb; }
    .dark .music-row:hover { background-color: #374151; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.hidden { display: none !important; }
    .modal-box { background: white; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .dark .modal-box { background: #1f2937; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div class="container max-w-5xl mx-auto px-4 py-8">
    <!-- 头部 -->
    <header class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold text-gray-800 dark:text-white">音乐管理</h1>
        <p class="text-gray-500 dark:text-gray-400 mt-1">管理首页音乐播放器的歌曲</p>
      </div>
      <div class="flex items-center space-x-3">
        <a href="/admin" class="px-4 py-2 bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors text-sm">返回后台</a>
        <a href="/" target="_blank" class="px-4 py-2 bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors text-sm">查看首页</a>
        <button id="newMusicBtn" class="px-4 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 transition-colors text-sm font-medium flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
          新增音乐
        </button>
      </div>
    </header>

    <!-- 搜索栏 -->
    <div class="flex items-center gap-4 mb-6">
      <div class="relative flex-1 max-w-md">
        <input type="text" id="searchInput" placeholder="搜索歌曲名或艺术家..."
          class="w-full px-4 py-2 pl-10 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      </div>
      <button id="refreshBtn" class="px-4 py-2 bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors text-sm">刷新</button>
    </div>

    <!-- 音乐列表 -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
      <table class="w-full">
        <thead class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">歌曲信息</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">平台</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">排序</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">状态</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">操作</th>
          </tr>
        </thead>
        <tbody id="musicTableBody" class="divide-y divide-gray-200 dark:divide-gray-700">
          <!-- 动态渲染 -->
        </tbody>
      </table>
      <div id="emptyState" class="hidden text-center py-12">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-300 dark:text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>
        <p class="mt-4 text-gray-500 dark:text-gray-400">暂无音乐，点击右上角新增</p>
      </div>
    </div>
  </div>

  <!-- 新建/编辑模态框 -->
  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
        <h3 id="modalTitle" class="text-lg font-semibold text-gray-800 dark:text-white">新增音乐</h3>
        <button id="closeModal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <form id="musicForm" class="p-6 space-y-4">
        <input type="hidden" id="musicId">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">歌曲标题 *</label>
          <input type="text" id="musicTitle" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">艺术家</label>
          <input type="text" id="musicArtist" placeholder="歌手/乐队名称" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">音乐链接 *</label>
          <input type="url" id="musicUrl" required placeholder="支持 mp3 直链、网易云外链等" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-400">
          <p class="text-xs text-gray-400 mt-1">支持 mp3/flac/wav 直链，或网易云音乐外链播放器地址</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">封面图 URL（可选）</label>
          <input type="url" id="musicCover" placeholder="https://..." class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-400">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">平台</label>
            <select id="musicPlatform" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-400">
              <option value="custom">自定义直链</option>
              <option value="netease">网易云音乐</option>
              <option value="qq">QQ音乐</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">排序</label>
            <input type="number" id="musicSort" value="0" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-400">
          </div>
        </div>
        <div class="flex items-center">
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" id="musicActive" checked class="w-4 h-4 text-primary-500 border-gray-300 rounded focus:ring-primary-400">
            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">启用（在首页显示）</span>
          </label>
        </div>
        <div id="formMessage" class="hidden rounded-lg px-4 py-3 text-sm"></div>
        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200 dark:border-gray-700">
          <button type="button" id="cancelBtn" class="px-4 py-2 bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors text-sm">取消</button>
          <button type="submit" id="saveBtn" class="px-4 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 transition-colors text-sm font-medium">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div id="deleteModal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width: 400px;">
      <div class="p-6">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">确认删除</h3>
        <p class="text-sm text-gray-600 dark:text-gray-300 mb-6">确定要删除这首音乐吗？此操作无法撤销。</p>
        <div class="flex justify-end space-x-3">
          <button id="cancelDelete" class="px-4 py-2 bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors text-sm">取消</button>
          <button id="confirmDelete" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors text-sm font-medium">删除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/admin-shared.js"></script>
  <script src="/js/admin-cache.js"></script>
  <script>
    function getCsrfToken() {
      const meta = document.querySelector('meta[name="csrf-token"]');
      return meta ? meta.content : '';
    }

    let currentPage = 1;
    const pageSize = 50;
    let searchKeyword = '';
    let searchTimer = null;
    let deleteId = null;

    const musicTableBody = document.getElementById('musicTableBody');
    const emptyState = document.getElementById('emptyState');
    const editModal = document.getElementById('editModal');
    const deleteModal = document.getElementById('deleteModal');
    const formMessage = document.getElementById('formMessage');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMusics(musics) {
      if (!musics || musics.length === 0) {
        musicTableBody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      musicTableBody.innerHTML = musics.map(music => `
        <tr class="music-row transition-colors">
          <td class="px-6 py-4">
            <div class="flex items-center">
              ${music.cover_url ? `<img src="${escapeHtml(music.cover_url)}" alt="" class="w-10 h-10 rounded object-cover mr-3">` : `<div class="w-10 h-10 rounded bg-gray-200 dark:bg-gray-700 mr-3 flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg></div>`}
              <div>
                <div class="text-sm font-medium text-gray-800 dark:text-gray-100">${escapeHtml(music.title)}</div>
                ${music.artist ? `<div class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(music.artist)}</div>` : ''}
              </div>
            </div>
          </td>
          <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-300">
            ${music.platform === 'netease' ? '网易云' : music.platform === 'qq' ? 'QQ音乐' : '直链'}
          </td>
          <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-300">${music.sort_order || 0}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            ${music.is_active === 1
              ? '<span class="inline-block px-2 py-0.5 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 rounded text-xs">已启用</span>'
              : '<span class="inline-block px-2 py-0.5 bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300 rounded text-xs">已禁用</span>'}
          </td>
          <td class="px-6 py-4 text-right">
            <div class="flex items-center justify-end space-x-2">
              <button class="edit-btn transition-colors" style="color: #9ca3af; background: none; border: none; padding: 4px;" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#9ca3af'" data-id="${music.id}" title="编辑">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
              </button>
              <button class="delete-btn transition-colors" style="color: #9ca3af; background: none; border: none; padding: 4px;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#9ca3af'" data-id="${music.id}" title="删除">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');

      musicTableBody.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => editMusic(btn.dataset.id));
      });
      musicTableBody.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          deleteId = btn.dataset.id;
          deleteModal.classList.remove('hidden');
        });
      });
    }

    async function loadMusics() {
      try {
        const params = new URLSearchParams({ page: currentPage, pageSize });
        if (searchKeyword) params.set('keyword', searchKeyword);
        const res = await fetch(`/api/musics?${params.toString()}`);
        const data = await res.json();
        if (data.code === 200) {
          renderMusics(data.data);
        }
      } catch (e) {
        console.error('Load musics failed:', e);
      }
    }

    function openNewModal() {
      document.getElementById('modalTitle').textContent = '新增音乐';
      document.getElementById('musicForm').reset();
      document.getElementById('musicId').value = '';
      document.getElementById('musicSort').value = '0';
      document.getElementById('musicActive').checked = true;
      formMessage.classList.add('hidden');
      editModal.classList.remove('hidden');
    }

    async function editMusic(id) {
      try {
        const res = await fetch(`/api/musics/${id}`);
        const data = await res.json();
        if (data.code !== 200 || !data.data) {
          alert('加载音乐失败');
          return;
        }
        const m = data.data;
        document.getElementById('modalTitle').textContent = '编辑音乐';
        document.getElementById('musicId').value = m.id;
        document.getElementById('musicTitle').value = m.title;
        document.getElementById('musicArtist').value = m.artist || '';
        document.getElementById('musicUrl').value = m.music_url;
        document.getElementById('musicCover').value = m.cover_url || '';
        document.getElementById('musicPlatform').value = m.platform || 'custom';
        document.getElementById('musicSort').value = m.sort_order || 0;
        document.getElementById('musicActive').checked = m.is_active === 1;
        formMessage.classList.add('hidden');
        editModal.classList.remove('hidden');
      } catch (e) {
        alert('加载音乐失败：' + e.message);
      }
    }

    async function saveMusic(e) {
      e.preventDefault();
      const id = document.getElementById('musicId').value;
      const payload = {
        title: document.getElementById('musicTitle').value,
        artist: document.getElementById('musicArtist').value,
        music_url: document.getElementById('musicUrl').value,
        cover_url: document.getElementById('musicCover').value,
        platform: document.getElementById('musicPlatform').value,
        sort_order: parseInt(document.getElementById('musicSort').value) || 0,
        is_active: document.getElementById('musicActive').checked ? 1 : 0
      };

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中...';

      try {
        const csrfToken = getCsrfToken();
        const url = id ? `/api/musics/${id}` : '/api/musics';
        const method = id ? 'PUT' : 'POST';
        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken) headers['X-CSRF-Token'] = csrfToken;

        const res = await fetch(url, { method, headers, body: JSON.stringify(payload) });
        const data = await res.json();

        if (data.code === 200) {
          formMessage.className = 'rounded-lg px-4 py-3 text-sm bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400';
          formMessage.textContent = '保存成功！';
          formMessage.classList.remove('hidden');
          setTimeout(() => {
            editModal.classList.add('hidden');
            loadMusics();
          }, 800);
        } else {
          formMessage.className = 'rounded-lg px-4 py-3 text-sm bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400';
          formMessage.textContent = '保存失败：' + (data.message || '未知错误');
          formMessage.classList.remove('hidden');
        }
      } catch (e) {
        formMessage.className = 'rounded-lg px-4 py-3 text-sm bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400';
        formMessage.textContent = '保存失败：' + e.message;
        formMessage.classList.remove('hidden');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '保存';
      }
    }

    async function confirmDelete() {
      if (!deleteId) return;
      try {
        const csrfToken = getCsrfToken();
        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken) headers['X-CSRF-Token'] = csrfToken;
        const res = await fetch(`/api/musics/${deleteId}`, { method: 'DELETE', headers });
        const data = await res.json();
        if (data.code === 200) {
          deleteModal.classList.add('hidden');
          deleteId = null;
          loadMusics();
        } else {
          alert('删除失败：' + (data.message || '未知错误'));
        }
      } catch (e) {
        alert('删除失败：' + e.message);
      }
    }

    // 事件绑定
    document.getElementById('newMusicBtn').addEventListener('click', openNewModal);
    document.getElementById('closeModal').addEventListener('click', () => editModal.classList.add('hidden'));
    document.getElementById('cancelBtn').addEventListener('click', () => editModal.classList.add('hidden'));
    document.getElementById('musicForm').addEventListener('submit', saveMusic);
    document.getElementById('cancelDelete').addEventListener('click', () => { deleteModal.classList.add('hidden'); deleteId = null; });
    document.getElementById('confirmDelete').addEventListener('click', confirmDelete);
    document.getElementById('refreshBtn').addEventListener('click', loadMusics);
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchKeyword = e.target.value.trim();
        currentPage = 1;
        loadMusics();
      }, 300);
    });

    editModal.addEventListener('click', (e) => { if (e.target === editModal) editModal.classList.add('hidden'); });
    deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) { deleteModal.classList.add('hidden'); deleteId = null; } });

    loadMusics();
  </script>
</body>
</html>
